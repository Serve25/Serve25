<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Serve25 form registration</title>
  </head>
  <body>
    <!--
      This file exists only so Netlify's build bot can detect and register the
      inquiry form. It is never shown to visitors — the real form lives in
      src/routes/contact.tsx and POSTs here over AJAX.
      Every field below must match the field names submitted by that component.
    -->
    <form name="serve25-inquiry" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="serve25-inquiry" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="town" />
      <input type="text" name="service" />
      <input type="text" name="timing" />
      <textarea name="message"></textarea>
      <input type="text" name="bot-field" />
    </form>
  </body>
</html>
